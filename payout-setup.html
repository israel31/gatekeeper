<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payout Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(circle at top right, #e2e8f0 0%, #f8fafc 100%);
        }
        .input-with-icon {
            padding-left: 2.75rem; /* Space for icon */
        }
        .form-input {
            transition: all 0.2s;
            border: 1px solid #e2e8f0;
        }
        .form-input:focus {
            border-color: #10b981;
            ring: 4px solid rgba(16, 185, 129, 0.1);
            outline: none;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-12">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-lg font-bold text-[#0a2540] flex items-center gap-2">
                <i data-lucide="wallet" class="w-5 h-5"></i>
                <span>Payout Configuration</span>
            </h1>
            <a href="/admin.html" class="text-sm font-medium text-slate-500 hover:text-[#0a2540] transition flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Back
            </a>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">

        <div class="text-center space-y-2 mb-8">
            <h2 class="text-2xl font-bold text-[#0a2540]">Banking Details</h2>
            <p class="text-slate-500 max-w-md mx-auto">Connect your bank account to automatically receive earnings from your registration forms.</p>
        </div>

        <div id="status-card" class="hidden bg-[#0a2540] rounded-2xl p-6 text-white shadow-xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-white opacity-5 rounded-full -mr-16 -mt-16 pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 w-32 h-32 bg-emerald-500 opacity-10 rounded-full -ml-10 -mb-10 pointer-events-none"></div>
            
            <div class="relative z-10 flex items-start gap-4">
                <div class="p-3 bg-white/10 rounded-xl">
                    <i data-lucide="activity" class="w-6 h-6 text-emerald-400"></i>
                </div>
                <div>
                    <h3 class="text-xs font-bold uppercase tracking-wider text-blue-200 mb-1">Current Status</h3>
                    <div id="current-status-text" class="text-sm font-medium leading-relaxed opacity-90">
                        Loading status...
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="p-6 md:p-8">
                
                <div id="message-area" class="text-sm font-medium hidden p-4 rounded-xl mb-6 bg-red-50 text-red-600 border border-red-100"></div>

                <form id="payout-form" class="space-y-6">
                    
                    <div class="space-y-1.5">
                        <label for="bank_code" class="text-xs font-bold text-slate-500 uppercase ml-1">Select Bank <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="landmark" class="w-5 h-5"></i>
                            </div>
                            <select id="bank_code" required class="block w-full rounded-xl bg-slate-50 py-3.5 input-with-icon form-input text-slate-700 font-medium appearance-none cursor-pointer">
                                <option value="">Loading Banks...</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-slate-500">
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-1.5">
                        <label for="account_number" class="text-xs font-bold text-slate-500 uppercase ml-1">Account Number <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i data-lucide="hash" class="w-5 h-5"></i>
                            </div>
                            <input type="text" id="account_number" required pattern="\d{10}" maxlength="10" 
                                class="block w-full rounded-xl bg-slate-50 py-3.5 input-with-icon form-input text-slate-700 font-medium font-mono placeholder-slate-400" 
                                placeholder="0123456789">
                        </div>
                    </div>
                    
                    <div id="account-name-verification" class="hidden p-3 rounded-xl bg-amber-50 text-amber-700 text-sm font-medium flex items-center gap-2 animate-pulse">
                        <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Verifying account details...
                    </div>
                    
                    <div id="verification-result" class="hidden text-sm font-semibold p-3 rounded-xl bg-slate-50 border border-slate-100 text-slate-600"></div>

                    <button type="submit" id="save-button" class="w-full py-4 px-6 rounded-xl shadow-lg shadow-emerald-500/20 text-lg font-bold text-white bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4">
                        <i data-lucide="save" class="w-5 h-5"></i>
                        Save Payout Details
                    </button>
                </form>
            </div>
            
            <div class="bg-slate-50 p-4 border-t border-slate-200 flex items-center justify-center gap-2 text-xs text-slate-400">
                <i data-lucide="shield-check" class="w-4 h-4 text-emerald-500"></i>
                <span>Bank details are encrypted and processed securely by Paystack.</span>
            </div>
        </div>

    </main>
    
    <script type="module">
        import { supabase, requireAuth, showMessage, SUPABASE_URL } from './js/utils.js';
        lucide.createIcons();

        // --- DOM Elements ---
        const formEl = document.getElementById('payout-form');
        const bankSelect = document.getElementById('bank_code');
        const accountInput = document.getElementById('account_number');
        const saveBtn = document.getElementById('save-button');
        const messageArea = document.getElementById('message-area');
        const verificationEl = document.getElementById('account-name-verification');
        const resultEl = document.getElementById('verification-result');
        const statusCard = document.getElementById('status-card');
        const statusText = document.getElementById('current-status-text');

        let user = null;
        let banksList = [];

        // --- Data Fetching & Verification ---
        
        // 1. Fetch Current Payout Status
        async function fetchCurrentStatus() {
            if (!user) return;
            const { data, error } = await supabase
                .from('users')
                .select('paystack_subaccount_code, bank_account_number, bank_code')
                .eq('id', user.id)
                .single();

            if (error && error.code !== 'PGRST116') { // PGRST116 means 'no row found' (new user)
                console.error("Error fetching status:", error);
                statusText.textContent = 'Error loading current status.';
                statusCard.classList.remove('hidden');
                return;
            }
            
            if (data && data.paystack_subaccount_code) {
                const bankName = banksList.find(b => b.code === data.bank_code)?.name || 'Unknown Bank';
                statusText.innerHTML = `✅ **Payouts Active.** <br>Subaccount: <code>${data.paystack_subaccount_code}</code><br>Bank: ${bankName}, Account: ${data.bank_account_number}.`;
                statusCard.classList.remove('hidden');
            } else {
                statusText.textContent = '⚠️ Payouts are NOT setup. Complete the form below to activate fee splitting.';
                statusCard.classList.remove('hidden');
            }
        }
        
        // 2. Resolve Account Number (Called on change after a small delay)
        let resolveTimeout;
        const debouncedResolve = () => {
            clearTimeout(resolveTimeout);
            resultEl.classList.add('hidden');
            
            const bankCode = bankSelect.value;
            const accountNumber = accountInput.value.trim();

            if (bankCode && accountNumber.length === 10) {
                verificationEl.classList.remove('hidden');
                verificationEl.textContent = 'Verifying account name...';

                resolveTimeout = setTimeout(async () => {
                    await resolveAccount(bankCode, accountNumber);
                }, 1000); 
            } else {
                verificationEl.classList.add('hidden');
            }
        };
        
        bankSelect.addEventListener('change', debouncedResolve);
        accountInput.addEventListener('input', debouncedResolve);

        async function resolveAccount(bankCode, accountNumber) {
            try {
                // Call the secure Edge Function to resolve the account name (using the same logic as create-subaccount.ts)
                const edgeFunctionUrl = `${SUPABASE_URL}/functions/v1/create-subaccount`;
                const { data: { session } } = await supabase.auth.getSession();
                
                // We send a GET request to a hypothetical 'resolve-account' endpoint.
                // Since we only have 'create-subaccount', we'll rely on the server-side
                // verification logic during the save process for the most secure flow.

                // For immediate UI feedback, we just confirm details are ready for saving.
                verificationEl.classList.add('hidden');
                resultEl.textContent = `Account ready for saving. Final name verification happens on SAVE.`; 
                resultEl.classList.add('text-gray-600');
                resultEl.classList.remove('hidden', 'text-red-600', 'text-green-600');

            } catch (error) {
                verificationEl.classList.add('hidden');
                resultEl.textContent = `Verification Failed: ${error.message}`;
                resultEl.classList.add('text-red-600');
                resultEl.classList.remove('hidden', 'text-green-600');
            }
        }

        // --- Form Submission ---
        formEl.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i> Processing...';
            messageArea.classList.add('hidden');

            const bankCode = bankSelect.value;
            const accountNumber = accountInput.value.trim();
            const bankName = bankSelect.options[bankSelect.selectedIndex].text;

            try {
                // 1. Call the secure Edge Function to create the subaccount
                const edgeFunctionUrl = `${SUPABASE_URL}/functions/v1/create-subaccount`;
                const { data: { session } } = await supabase.auth.getSession();

                if (!session) throw new Error("User session expired. Please log out and back in.");
                
                const response = await fetch(edgeFunctionUrl, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${session.access_token}` 
                    },
                    body: JSON.stringify({
                        bank_code: bankCode,
                        account_number: accountNumber,
                        bank_name: bankName,
                        user_id: user.id 
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.error || 'Failed to create subaccount.');
                }
                
                // 2. Success
                showMessage('message-area', `Payout setup successful! Account verified as ${result.account_name}. Subaccount Code: ${result.subaccount_code}`, false);
                await fetchCurrentStatus(); // Refresh status card

            } catch (error) {
                console.error('Payout Setup Error:', error);
                showMessage('message-area', `Setup Failed: ${error.message}`, true);
                
            } finally {
                saveBtn.innerHTML = '<i data-lucide="save" class="w-5 h-5"></i> Save Payout Details';
                saveBtn.disabled = false;
                lucide.createIcons(); // Re-init icons if content changed
            }
        });

        // --- Dynamic Bank List Implementation ---
        async function populateBanks() {
            const edgeFunctionUrl = `${SUPABASE_URL}/functions/v1/fetch-banks`;
            bankSelect.innerHTML = '<option value="">Loading Banks...</option>';
            
            try {
                const response = await fetch(edgeFunctionUrl, { method: 'GET' });
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Server failed to return bank list.');
                }
                
                banksList = data; // Store the list globally for fetchCurrentStatus
                bankSelect.innerHTML = '<option value="">Select your Bank</option>'; // Reset dropdown
                
                data.forEach(bank => {
                    const option = document.createElement('option');
                    option.value = bank.code;
                    option.textContent = bank.name;
                    bankSelect.appendChild(option);
                });
                
            } catch (error) {
                console.error("Failed to fetch banks:", error);
                bankSelect.innerHTML = '<option value="">Error Loading Banks</option>';
                showMessage('message-area', `Failed to load banks: ${error.message}`, true);
            }
        }
        
        async function init() {
            user = await requireAuth();
            if (!user) return; 
            
            await populateBanks();
            await fetchCurrentStatus();
        }

        init();
    </script>
</body>
</html>
