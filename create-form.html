<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Form</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .input-primary { width: 100%; border-radius: 0.75rem; border: 1px solid #e2e8f0; padding: 0.875rem; transition: all; }
        .input-primary:focus { border-color: #0a2540; outline: none; }
    </style>
</head>

<body class="min-h-screen text-slate-800 pb-12">

<header class="bg-white border-b border-slate-200 sticky top-0 z-20">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-lg font-bold text-[#0a2540] flex items-center gap-2">
            <i data-lucide="layout-template" class="w-5 h-5"></i> Form Creator
        </h1>
        <a href="/admin.html" class="text-sm font-medium text-slate-500 hover:text-[#0a2540] transition">Cancel</a>
    </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-8">
<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8">

<form id="form-creator" class="space-y-12">

<!-- PAYMENT -->
<div class="bg-slate-50 p-6 rounded-xl border border-slate-200">
    <div class="flex items-center justify-between mb-4">
        <label class="text-sm font-bold text-slate-900">Require Payment?</label>
        <input type="checkbox" id="requires_payment" checked class="w-5 h-5 rounded text-[#0a2540]">
    </div>

    <div id="payment-fields" class="space-y-4">
        <div>
            <label class="block text-xs font-bold uppercase text-slate-500 mb-1">Price (Naira)</label>
            <div class="relative">
                <span class="absolute left-4 top-3.5 text-slate-400">₦</span>
                <input type="number" id="price" min="100" value="5000" class="input-primary pl-10">
            </div>
        </div>
    </div>
</div>

<button type="submit" id="save-form-btn"
    class="w-full py-4 bg-[#0a2540] text-white font-bold rounded-xl">
    Launch Form
</button>

</form>
</div>
</main>

<script type="module">
import { supabase, requireAuth } from '/js/utils.js';
lucide.createIcons();

/* ===============================
   PAYSTACK + LIVE BREAKDOWN
================================ */

const PAYSTACK_PERCENT = 0.015;
const PAYSTACK_FLAT = 100;
const PAYSTACK_THRESHOLD = 2500;
const PAYSTACK_CAP = 2000;
const PLATFORM_FEE = 10;

const priceInput = document.getElementById('price');

let baseAmount = Number(priceInput.value);

/* Toggle */
const toggleWrap = document.createElement('div');
toggleWrap.className = "flex items-center gap-2 mt-3 text-sm text-slate-600";

toggleWrap.innerHTML = `
  <input type="checkbox" id="add_charges" checked class="w-4 h-4 rounded text-[#0a2540]">
  <label for="add_charges">Let registrant pay transaction charges</label>
`;

priceInput.closest('div').appendChild(toggleWrap);

const addChargesCheckbox = document.getElementById('add_charges');

/* Breakdown */
const breakdown = document.createElement('div');
breakdown.className = "mt-3 text-xs text-slate-500 space-y-1";
priceInput.closest('div').appendChild(breakdown);

/* Helpers */
function paystackFee(amount) {
    let fee = amount * PAYSTACK_PERCENT;
    if (amount >= PAYSTACK_THRESHOLD) fee += PAYSTACK_FLAT;
    return Math.min(fee, PAYSTACK_CAP);
}

function chargeInclusive(amount) {
    let gross = amount;
    for (let i = 0; i < 5; i++) {
        gross = amount + paystackFee(gross) + PLATFORM_FEE;
    }
    return Math.ceil(gross);
}

function updateUI() {
    const entered = Number(priceInput.value);
    if (!entered || entered < 100) return;

    baseAmount = entered;

    if (addChargesCheckbox.checked) {
        const gross = chargeInclusive(baseAmount);
        const psFee = paystackFee(gross);

        priceInput.value = gross;

        breakdown.innerHTML = `
          <div>Registrant pays: <strong>₦${gross.toLocaleString()}</strong></div>
          <div>Paystack fee: ₦${psFee.toLocaleString()}</div>
          <div>Platform fee: ₦${PLATFORM_FEE}</div>
          <div class="font-medium text-slate-700">
            You receive: ₦${baseAmount.toLocaleString()}
          </div>
        `;
    } else {
        breakdown.innerHTML = `
          <div>Registrant pays: <strong>₦${baseAmount.toLocaleString()}</strong></div>
          <div class="font-medium text-slate-700">
            You receive: ₦${baseAmount.toLocaleString()}
          </div>
        `;
    }
}

priceInput.addEventListener('input', updateUI);
addChargesCheckbox.addEventListener('change', updateUI);

updateUI();

/* ===============================
   FORM SUBMIT
================================ */

const formCreator = document.getElementById('form-creator');
const saveFormBtn = document.getElementById('save-form-btn');
let user = await requireAuth();

formCreator.addEventListener('submit', async (e) => {
    e.preventDefault();
    saveFormBtn.disabled = true;

    const finalAmount = Number(priceInput.value);

    const formData = {
        user_id: user.id,
        requires_payment: true,
        price: finalAmount * 100,
        base_price: baseAmount * 100,
        platform_fee: PLATFORM_FEE * 100
    };

    await supabase.from('forms').insert(formData);
    window.location.href = '/admin.html';
});
</script>

</body>
</html>
