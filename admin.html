<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
        .card { background: white; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05); }
        .nav-link { color: #64748b; font-weight: 500; transition: color 0.2s; }
        .nav-link:hover { color: #0f172a; }
        /* Mobile Scroll for Table */
        .table-container { overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: 0.75rem; border: 1px solid #e2e8f0; }
        .status-badge { padding: 4px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.025em; }
    </style>
</head>
<body class="min-h-screen text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-[#0a2540] flex items-center justify-center">
                        <div class="w-2 h-2 bg-[#10b981] rounded-full"></div>
                    </div>
                    <span class="font-bold text-lg text-[#0a2540]">Dashboard</span>
                </div>
                <div class="flex items-center gap-4">
                    <span id="auth-status" class="hidden md:inline text-xs text-slate-400"></span>
                    <button id="logout-button" class="text-slate-500 hover:text-red-600 transition">
                        <i data-lucide="log-out" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8 space-y-8">
        
        <div id="message-area" class="hidden p-4 rounded-xl bg-blue-50 text-blue-700 border border-blue-100 text-sm font-medium"></div>
        <div id="payout-alert" class="hidden p-4 rounded-xl bg-amber-50 text-amber-800 border border-amber-100 flex items-start gap-3">
            <i data-lucide="alert-triangle" class="w-5 h-5 flex-shrink-0 mt-0.5"></i>
            <div>
                <p class="font-bold">Setup Payouts</p>
                <p class="text-sm mt-1 opacity-90">Payments are currently disabled. <a href="/payout-setup.html" class="underline hover:text-amber-900">Configure bank details &rarr;</a></p>
            </div>
        </div>

        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div class="w-full md:w-auto relative">
                <select id="form-selector" class="w-full md:w-80 pl-4 pr-10 py-3 rounded-xl border-slate-200 bg-white shadow-sm focus:ring-2 focus:ring-[#0a2540] outline-none appearance-none font-medium text-slate-700 cursor-pointer">
                    <option value="">Loading Forms...</option>
                </select>
                <i data-lucide="chevron-down" class="absolute right-3 top-3.5 w-5 h-5 text-slate-400 pointer-events-none"></i>
            </div>
            
            <div class="grid grid-cols-2 gap-3 w-full md:w-auto">
                <a href="/payout-setup.html" class="flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-white border border-slate-200 text-slate-700 font-semibold hover:bg-slate-50 transition shadow-sm">
                    <i data-lucide="credit-card" class="w-4 h-4"></i> <span class="text-sm">Payouts</span>
                </a>
                <a href="/create-form.html" class="flex items-center justify-center gap-2 px-5 py-3 rounded-xl bg-[#0a2540] text-white font-semibold hover:bg-[#163a5f] transition shadow-lg shadow-blue-900/10">
                    <i data-lucide="plus" class="w-4 h-4"></i> <span class="text-sm">New Form</span>
                </a>
            </div>
        </div>

        <div class="card p-6 flex flex-col md:flex-row items-center justify-between gap-6 border-l-4 border-[#0a2540]">
            <div class="w-full">
                <div class="flex items-center gap-3 mb-1">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-400">Public Link</span>
                    <div id="portal-status-container" class="flex items-center gap-2 px-2 py-0.5 rounded bg-slate-100">
                        <span id="portal-status-icon" class="w-2 h-2 rounded-full bg-slate-400"></span>
                        <span id="portal-status-text" class="text-xs font-medium text-slate-600">Loading...</span>
                    </div>
                </div>
                <div class="flex items-center gap-3 bg-slate-50 p-2 rounded-lg border border-slate-200">
                    <p id="public-link-display" class="font-mono text-sm text-slate-600 truncate flex-1">Select a form...</p>
                    <button id="copy-link-btn" class="p-2 hover:bg-white rounded-md text-slate-500 hover:text-[#0a2540] transition disabled:opacity-50" title="Copy">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
            <button id="toggle-portal-button" class="w-full md:w-auto whitespace-nowrap px-6 py-3 rounded-xl font-semibold text-sm transition border" disabled>
                Manage Access
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="card p-6">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-sm font-medium text-slate-500">Total Entries</span>
                    <div class="p-2 bg-blue-50 text-blue-600 rounded-lg"><i data-lucide="users" class="w-5 h-5"></i></div>
                </div>
                <p id="stat-total-entries" class="text-3xl font-bold text-slate-900">...</p>
            </div>
            <div class="card p-6">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-sm font-medium text-slate-500">Paid Registrations</span>
                    <div class="p-2 bg-emerald-50 text-emerald-600 rounded-lg"><i data-lucide="check-circle" class="w-5 h-5"></i></div>
                </div>
                <p id="stat-paid-entries" class="text-3xl font-bold text-emerald-600">...</p>
            </div>
            <div class="card p-6">
                <div class="flex items-center justify-between mb-4">
                    <span class="text-sm font-medium text-slate-500">Total Revenue</span>
                    <div class="p-2 bg-[#0a2540] text-white rounded-lg"><i data-lucide="wallet" class="w-5 h-5"></i></div>
                </div>
                <p id="stat-total-earnings" class="text-3xl font-bold text-[#0a2540]">...</p>
            </div>
        </div>

        <div class="space-y-4">
            <div class="flex flex-col md:flex-row gap-3">
                <div class="relative flex-grow">
                    <i data-lucide="search" class="absolute left-3 top-3 w-5 h-5 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="Search name or email..." class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 focus:border-[#0a2540] focus:ring-1 focus:ring-[#0a2540] outline-none transition">
                </div>
                <select id="filter-status" class="py-2.5 px-4 rounded-xl border border-slate-200 bg-white outline-none">
                    <option value="all">All Status</option>
                    <option value="paid">Paid</option>
                    <option value="unpaid">Unpaid</option>
                </select>
                <div class="flex gap-2 overflow-x-auto pb-1 md:pb-0">
                    <button id="export-all-btn" class="px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold uppercase tracking-wide text-slate-600 hover:bg-slate-50 whitespace-nowrap">CSV All</button>
                    <button id="export-paid-btn" class="px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold uppercase tracking-wide text-emerald-600 hover:bg-emerald-50 whitespace-nowrap">CSV Paid</button>
                    <button id="export-unpaid-btn" class="px-4 py-2.5 rounded-xl bg-white border border-slate-200 text-xs font-bold uppercase tracking-wide text-red-500 hover:bg-red-50 whitespace-nowrap">CSV Unpaid</button>
                </div>
            </div>

            <div class="card overflow-hidden">
                <div class="table-container">
                    <table class="min-w-full divide-y divide-slate-100">
                        <thead class="bg-slate-50">
                            <tr>
                                <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Name</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Status</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Details</th>
                                <th class="px-6 py-4 text-left text-xs font-bold text-slate-500 uppercase tracking-wider">Date</th>
                            </tr>
                        </thead>
                        <tbody id="entries-table-body" class="bg-white divide-y divide-slate-100">
                            <tr><td colspan="4" class="text-center py-8 text-slate-400">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
                <div id="no-entries" class="hidden text-center py-12 text-slate-400 text-sm">No entries found matching filters.</div>
                
                <div class="border-t border-slate-100 px-6 py-4 flex items-center justify-between">
                    <button id="prev-page" class="text-sm font-medium text-slate-500 disabled:opacity-30 hover:text-[#0a2540]" disabled>&larr; Previous</button>
                    <span id="page-info" class="text-xs font-medium text-slate-400">Page 1</span>
                    <button id="next-page" class="text-sm font-medium text-slate-500 disabled:opacity-30 hover:text-[#0a2540]" disabled>Next &rarr;</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { supabase, requireAuth, signOut, showMessage, SUPABASE_URL } from '/js/utils.js';
        lucide.createIcons(); // Initialize icons

        // ... (Keep ALL your existing Admin logic here exactly as is) ...
        // ... (Include formatAnswers, renderTable, fetchEntries, etc.) ...
        
        // --- DOM Elements (re-mapping required for UI changes) ---
        // Just ensure these IDs exist in the HTML above (I checked, they do).
        const tableBody = document.getElementById('entries-table-body');
        const searchInput = document.getElementById('search-input');
        const filterStatus = document.getElementById('filter-status');
        const prevBtn = document.getElementById('prev-page');
        const nextBtn = document.getElementById('next-page');
        const pageInfo = document.getElementById('page-info');
        const logoutBtn = document.getElementById('logout-button');
        const authStatusEl = document.getElementById('auth-status');
        const toggleBtn = document.getElementById('toggle-portal-button');
        const statusIcon = document.getElementById('portal-status-icon');
        const statusText = document.getElementById('portal-status-text');
        const exportAllBtn = document.getElementById('export-all-btn');
        const exportPaidBtn = document.getElementById('export-paid-btn');
        const exportUnpaidBtn = document.getElementById('export-unpaid-btn');
        const noEntriesEl = document.getElementById('no-entries');
        const formSelector = document.getElementById('form-selector');
        const publicLinkDisplay = document.getElementById('public-link-display');
        const copyLinkBtn = document.getElementById('copy-link-btn');
        const statTotalEntries = document.getElementById('stat-total-entries');
        const statPaidEntries = document.getElementById('stat-paid-entries');
        const statTotalEarnings = document.getElementById('stat-total-earnings');
        const payoutAlertEl = document.getElementById('payout-alert');

        // ... (PASTE THE REST OF YOUR LOGIC HERE) ...
        const ENTRIES_PER_PAGE = 10;
        let currentPage = 0;
        let totalCount = 0;
        let FORM_ID = null; 
        let IS_OPEN = null;
        let FORM_PRICE = 0; 
        let FORM_SLUG = null; 
        let user = null;
        let isPayoutSetup = false; 

        const formatCurrency = (kobo) => {
            if (typeof kobo !== 'number') return 'N/A';
            const naira = kobo / 100;
            return new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN' }).format(naira);
        };

        const formatAnswers = (data) => {
            let answers = {};
            if (!data) answers = {};
            else if (typeof data === 'string') {
                try { answers = JSON.parse(data); } catch (e) { return '<span class="text-xs text-red-400">Error</span>'; }
            } else if (typeof data === 'object') { answers = data; }
            
            return Object.entries(answers).map(([key, value]) =>
                `<div class="text-xs text-slate-500 mb-0.5"><span class="font-semibold text-slate-700">${key}:</span> ${value}</div>`
            ).join('');
        };

        const renderTable = (entries) => {
            tableBody.innerHTML = '';
            noEntriesEl.classList.add('hidden');
            if (entries.length === 0) { noEntriesEl.classList.remove('hidden'); return; }

            entries.forEach(entry => {
                // UI: Badges for status
                const statusBadge = entry.payment_status === 'paid' 
                    ? `<span class="status-badge bg-emerald-100 text-emerald-700">Paid</span>` 
                    : `<span class="status-badge bg-red-100 text-red-700">Unpaid</span>`;
                
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition";
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap">
                        <div class="text-sm font-semibold text-slate-900">${entry.name}</div>
                        <div class="text-xs text-slate-500">${entry.email}</div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap">${statusBadge}</td>
                    <td class="px-6 py-4 text-sm max-w-xs overflow-hidden">${formatAnswers(entry.answers)}</td>
                    <td class="px-6 py-4 whitespace-nowrap text-xs text-slate-400">${new Date(entry.created_at).toLocaleDateString()}</td>
                `;
                tableBody.appendChild(row);
            });
        };

        // ... (Keep updatePaginationControls, fetchFormAnalytics, fetchEntries, fetchUserForms, updatePortalStatusUI, event listeners, etc.) ...
        
        // IMPORTANT UI TWEAK FOR TOGGLE BUTTON
        function updatePortalStatusUI() {
            if (IS_OPEN === true) {
                statusText.textContent = 'Portal Online';
                statusIcon.className = 'w-2 h-2 rounded-full bg-emerald-500';
                toggleBtn.textContent = 'Close Portal';
                toggleBtn.className = 'w-full md:w-auto px-6 py-3 rounded-xl font-semibold text-sm transition bg-white border border-red-200 text-red-600 hover:bg-red-50';
            } else if (IS_OPEN === false) {
                statusText.textContent = 'Portal Offline';
                statusIcon.className = 'w-2 h-2 rounded-full bg-red-500';
                toggleBtn.textContent = 'Open Portal';
                toggleBtn.className = 'w-full md:w-auto px-6 py-3 rounded-xl font-semibold text-sm transition bg-emerald-600 text-white hover:bg-emerald-700 shadow-lg shadow-emerald-500/20';
            }
            if (FORM_SLUG) {
                const publicUrl = `${window.location.origin}/f/${FORM_SLUG}`; 
                publicLinkDisplay.textContent = publicUrl;
            } else {
                publicLinkDisplay.textContent = 'Select a form...';
                copyLinkBtn.disabled = true;
            }
        }
        
        // ... (Continue pasting logic from your original file) ...
        const updatePaginationControls = () => {
            const totalPages = Math.ceil(totalCount / ENTRIES_PER_PAGE);
            pageInfo.textContent = `Page ${currentPage + 1} of ${totalPages || 1}`;
            prevBtn.disabled = currentPage === 0;
            nextBtn.disabled = currentPage >= totalPages - 1;
        };

        async function fetchFormAnalytics() {
             if (!FORM_ID) return;
             statTotalEntries.textContent = '...'; statPaidEntries.textContent = '...'; statTotalEarnings.textContent = '...';
             const { count: totalCount } = await supabase.from('entries').select('id', { count: 'exact', head: true }).eq('form_id', FORM_ID);
             const { count: paidCount } = await supabase.from('entries').select('id', { count: 'exact', head: true }).eq('form_id', FORM_ID).eq('payment_status', 'paid');
             const totalEarnings = (paidCount || 0) * FORM_PRICE;
             statTotalEntries.textContent = totalCount || 0;
             statPaidEntries.textContent = paidCount || 0;
             statTotalEarnings.textContent = formatCurrency(totalEarnings);
        }

        async function fetchEntries() {
            if (!FORM_ID) { tableBody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-slate-400">Select a form to view entries.</td></tr>'; noEntriesEl.classList.add('hidden'); return; }
            fetchFormAnalytics(); 
            const offset = currentPage * ENTRIES_PER_PAGE;
            const filter = filterStatus.value;
            const search = searchInput.value.trim();
            let query = supabase.from('entries').select('*', { count: 'exact' }).order('created_at', { ascending: false }).eq('form_id', FORM_ID).range(offset, offset + ENTRIES_PER_PAGE - 1);
            if (filter !== 'all') query = query.eq('payment_status', filter);
            if (search) query = query.or(`name.ilike.%${search}%,email.ilike.%${search}%`);
            tableBody.innerHTML = '<tr><td colspan="4" class="text-center py-8 text-slate-400">Loading...</td></tr>';
            const { data, error, count } = await query;
            if (error) return;
            totalCount = count;
            renderTable(data);
            updatePaginationControls();
        }

        async function fetchUserForms() {
            formSelector.innerHTML = '<option value="">Loading...</option>'; 
            try {
                const { data: { session } } = await supabase.auth.getSession();
                if (!session) throw new Error("Session expired.");
                
                const response = await fetch(`${SUPABASE_URL}/functions/v1/get-user-forms`, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` }, 
                });
                const data = await response.json(); 
                
                formSelector.innerHTML = ''; 
                if (data.length === 0) { formSelector.innerHTML = '<option>No Forms Found</option>'; return; }
                
                data.forEach(form => {
                    const option = document.createElement('option');
                    option.value = form.id;
                    option.textContent = `${form.title}`; 
                    option.dataset.isOpen = form.is_open;
                    option.dataset.slug = form.slug; 
                    
                    // --- CHANGE HERE: Use base_price (Net) if available, otherwise price (Gross) ---
                    // This ensures the "Total Revenue" card shows what YOU earn, not what the user paid.
                    option.dataset.price = form.base_price || form.price; 
                    
                    formSelector.appendChild(option);
                });

                FORM_ID = data[0].id; 
                IS_OPEN = data[0].is_open; 
                FORM_SLUG = data[0].slug; 
                
                // --- CHANGE HERE: Same logic for the initial load ---
                FORM_PRICE = parseInt(data[0].base_price);
                
                toggleBtn.disabled = false; 
                updatePortalStatusUI(); 
                fetchEntries();
            } catch (error) { console.error(error); }
        }

        toggleBtn.addEventListener('click', async () => {
            if (!FORM_ID) return;
            toggleBtn.disabled = true; toggleBtn.textContent = 'Updating...';
            try {
                const { data: { session } } = await supabase.auth.getSession();
                const response = await fetch(`${SUPABASE_URL}/functions/v1/toggle-form`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` }, body: JSON.stringify({ form_id: FORM_ID, is_open: !IS_OPEN }) });
                const result = await response.json();
                IS_OPEN = result.is_open;
                updatePortalStatusUI(); showMessage('message-area', `Portal ${IS_OPEN ? 'Opened' : 'Closed'}`);
            } catch (error) { showMessage('message-area', error.message, true); } finally { toggleBtn.disabled = false; updatePortalStatusUI(); }
        });

        const handleExport = async (type) => {
            if (!FORM_ID) return;
            const btn = document.getElementById(`export-${type}-btn`); btn.textContent = `...`; btn.disabled = true;
            try {
                const { data: { session } } = await supabase.auth.getSession();
                const response = await fetch(`${SUPABASE_URL}/functions/v1/export-csv`, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` }, body: JSON.stringify({ form_id: FORM_ID, type }) });
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a'); a.style.display = 'none'; a.href = url; a.download = `entries_${type}.csv`; document.body.appendChild(a); a.click(); window.URL.revokeObjectURL(url);
            } catch (error) { showMessage('message-area', 'Export failed', true); } finally { btn.textContent = `CSV ${type}`; btn.disabled = false; }
        };
        exportAllBtn.addEventListener('click', () => handleExport('all'));
        exportPaidBtn.addEventListener('click', () => handleExport('paid'));
        exportUnpaidBtn.addEventListener('click', () => handleExport('unpaid'));

        prevBtn.addEventListener('click', () => { if (currentPage > 0) { currentPage--; fetchEntries(); } });
        nextBtn.addEventListener('click', () => { currentPage++; fetchEntries(); });
        filterStatus.addEventListener('change', () => { currentPage = 0; fetchEntries(); });
        searchInput.addEventListener('input', () => { currentPage = 0; fetchEntries(); });
        logoutBtn.addEventListener('click', signOut);
        copyLinkBtn.addEventListener('click', () => { navigator.clipboard.writeText(publicLinkDisplay.textContent); showMessage('message-area', 'Copied!', false); });
        
        formSelector.addEventListener('change', () => {
            const selectedOption = formSelector.options[formSelector.selectedIndex];
            if (selectedOption.value) {
                FORM_ID = selectedOption.value;
                IS_OPEN = selectedOption.dataset.isOpen === 'true'; 
                FORM_SLUG = selectedOption.dataset.slug; 
                FORM_PRICE = parseInt(selectedOption.dataset.price); 
                currentPage = 0; updatePortalStatusUI(); fetchEntries();
            }
        });

        function subscribeToRealtime() { supabase.channel('public:entries').on('postgres_changes', { event: '*', schema: 'public', table: 'entries' }, () => { fetchEntries(); }).subscribe(); }

        async function init() {
            user = await requireAuth(); if (!user) return; 
            authStatusEl.textContent = user.email;
            const { data: payoutData } = await supabase.from('users').select('paystack_subaccount_code').eq('id', user.id).single();
            if (!payoutData?.paystack_subaccount_code) payoutAlertEl.classList.remove('hidden');
            await fetchUserForms(); await fetchEntries(); subscribeToRealtime();
        }
        init();
    </script>
</body>
</html>
