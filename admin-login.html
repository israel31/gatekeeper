<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal</title>
    
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self'; 
        script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net https://unpkg.com https://esm.sh; 
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
        font-src 'self' https://fonts.gstatic.com data:; 
        img-src 'self' data: https://www.transparenttextures.com; 
        connect-src 'self' https://*.supabase.co https://*.supabase.in https://api.paystack.co;
    ">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(circle at top right, #e2e8f0 0%, #f8fafc 100%);
        }
        .brand-bg { background-color: #0a2540; }
        .input-focus:focus {
            border-color: #0a2540;
            ring: 2px solid rgba(10, 37, 64, 0.1);
            outline: none;
        }
        /* Tabs */
        .tab-active { color: #0a2540; border-bottom: 2px solid #0a2540; }
        .tab-inactive { color: #64748b; border-bottom: 2px solid transparent; }
        .tab-inactive:hover { color: #334155; border-bottom: 2px solid #cbd5e1; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white shadow-2xl rounded-3xl overflow-hidden border border-slate-100">
        
        <div class="brand-bg p-8 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
            <h1 class="text-2xl font-bold text-white relative z-10">Admin Access</h1>
            <p class="text-blue-200 text-sm mt-1 relative z-10">Manage your forms and payouts</p>
        </div>

        <div class="flex border-b border-slate-100 bg-slate-50/50">
            <button id="tab-login" class="flex-1 py-4 text-sm font-bold uppercase tracking-wider tab-active transition-all">
                Log In
            </button>
            <button id="tab-signup" class="flex-1 py-4 text-sm font-bold uppercase tracking-wider tab-inactive transition-all">
                Sign Up
            </button>
        </div>

        <div class="p-8 pt-6">
            <form id="login-form" class="space-y-5">
                <div class="space-y-1.5">
                    <label for="email" class="text-xs font-bold text-slate-500 uppercase ml-1">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com"
                        class="block w-full rounded-xl border-slate-200 bg-slate-50 p-3.5 text-slate-900 input-focus border transition-all">
                </div>

                <div class="space-y-1.5">
                    <label for="password" class="text-xs font-bold text-slate-500 uppercase ml-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="block w-full rounded-xl border-slate-200 bg-slate-50 p-3.5 text-slate-900 input-focus border transition-all">
                </div>

                <div id="message-area" class="text-sm font-medium hidden p-4 rounded-xl text-center"></div>

                <button type="submit" id="login-button" class="w-full py-4 rounded-xl text-white font-bold bg-[#0a2540] hover:bg-[#163a5f] active:scale-[0.98] transition-all shadow-lg shadow-blue-900/20 text-lg">
                    Log In
                </button>
            </form>
            
            <p class="text-center text-xs text-slate-400 mt-6">
                Secure Authentication via Supabase
            </p>
        </div>
    </div>

    <script type="module">
        import { supabase, auth, showMessage } from './js/utils.js';

        const formEl = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-button');
        const messageArea = document.getElementById('message-area');
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');

        let isLoginMode = true;

        // Toggle UI logic
        function toggleMode(login) {
            isLoginMode = login;
            formEl.reset();
            messageArea.classList.add('hidden');
            
            if (isLoginMode) {
                tabLogin.className = 'flex-1 py-4 text-sm font-bold uppercase tracking-wider tab-active transition-all';
                tabSignup.className = 'flex-1 py-4 text-sm font-bold uppercase tracking-wider tab-inactive transition-all';
                loginBtn.textContent = 'Log In';
                loginBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-700');
                loginBtn.classList.add('bg-[#0a2540]', 'hover:bg-[#163a5f]');
            } else {
                tabLogin.className = 'flex-1 py-4 text-sm font-bold uppercase tracking-wider tab-inactive transition-all';
                tabSignup.className = 'flex-1 py-4 text-sm font-bold uppercase tracking-wider tab-active transition-all';
                loginBtn.textContent = 'Create Account';
                // Use Emerald for Signup to differentiate
                loginBtn.classList.remove('bg-[#0a2540]', 'hover:bg-[#163a5f]');
                loginBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-700');
            }
        }

        tabLogin.addEventListener('click', () => toggleMode(true));
        tabSignup.addEventListener('click', () => toggleMode(false));

        // Check session
        auth.getUser().then(({ data: { user } }) => {
            if (user) window.location.href = '/admin.html';
        });

        formEl.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginBtn.disabled = true;
            const originalText = loginBtn.textContent;
            loginBtn.textContent = isLoginMode ? 'Verifying...' : 'Creating...';
            messageArea.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                if (isLoginMode) {
                    // Login Logic
                    const { error } = await auth.signInWithPassword({ email, password });
                    if (error) throw new Error(error.message);
                    window.location.href = '/admin.html';
                } else {
                    // Signup Logic (Added)
                    const { data, error } = await supabase.auth.signUp({ email, password });
                    if (error) throw new Error(error.message);
                    
                    showMessage('message-area', 'Account created! Please check your email to confirm.', false); // False = Success (Green)
                    loginBtn.textContent = 'Check Email';
                    return; 
                }

            } catch (error) {
                console.error('Auth Error:', error);
                showMessage('message-area', error.message, true); // True = Error (Red)
                loginBtn.textContent = originalText;
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
