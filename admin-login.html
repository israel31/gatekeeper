<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src https://fonts.gstatic.com; connect-src 'self' https://nugxkqclzusgibyqemou.supabase.co https://api.paystack.co;">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden">
        <div class="bg-[#0a2540] p-8 text-center">
             <h1 class="text-2xl font-bold text-white tracking-wide">Admin Portal</h1>
             <p class="text-blue-200 text-sm mt-1">Secure Access</p>
        </div>

        <div class="p-8">
            <form id="login-form" class="space-y-6">
                <div class="space-y-1">
                    <label for="email" class="text-xs font-bold text-slate-500 uppercase">Email</label>
                    <input type="email" id="email" required class="block w-full rounded-xl border-slate-200 bg-slate-50 p-3.5 focus:bg-white focus:border-blue-900 focus:ring-1 focus:ring-blue-900 transition-all outline-none border">
                </div>

                <div class="space-y-1">
                    <label for="password" class="text-xs font-bold text-slate-500 uppercase">Password</label>
                    <input type="password" id="password" required class="block w-full rounded-xl border-slate-200 bg-slate-50 p-3.5 focus:bg-white focus:border-blue-900 focus:ring-1 focus:ring-blue-900 transition-all outline-none border">
                </div>

                <div id="message-area" class="text-sm font-medium hidden p-3 rounded-lg bg-red-50 text-red-600 border border-red-100 text-center"></div>

                <button type="submit" id="login-button" class="w-full py-4 rounded-xl text-white font-bold bg-[#0a2540] hover:bg-[#0f3057] active:scale-[0.98] transition-all shadow-lg shadow-blue-900/20">
                    Log In
                </button>
            </form>
        </div>
    </div>

    <script type="module">
        import { auth, showMessage } from './js/utils.js';
        const formEl = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-button');
        const messageArea = document.getElementById('message-area');

        auth.getUser().then(({ data: { user } }) => { if (user) window.location.href = '/admin.html'; });

        formEl.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginBtn.disabled = true;
            loginBtn.textContent = 'Verifying...';
            messageArea.classList.add('hidden');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            try {
                const { error } = await auth.signInWithPassword({ email, password });
                if (error) throw new Error(error.message);
                window.location.href = '/admin.html';
            } catch (error) {
                console.error('Login Error:', error);
                showMessage('message-area', error.message, true);
                loginBtn.textContent = 'Log In';
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
