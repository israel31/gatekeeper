<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.tailwindcss.com; font-src https://fonts.gstatic.com; connect-src 'self' https://nugxkqclzusgibyqemou.supabase.co https://api.paystack.co;">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(circle at top right, #e2e8f0 0%, #f8fafc 100%);
        }
        .brand-bg { background-color: #0a2540; }
        .input-field {
            transition: all 0.2s;
        }
        .input-field:focus {
            border-color: #0a2540;
            ring: 2px solid rgba(10, 37, 64, 0.1);
        }
        /* Tab Animation */
        .tab-active {
            color: #0a2540;
            border-bottom: 2px solid #0a2540;
        }
        .tab-inactive {
            color: #64748b;
            border-bottom: 2px solid transparent;
        }
        .tab-inactive:hover {
            color: #334155;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white shadow-2xl rounded-3xl overflow-hidden border border-slate-100">
        
        <div class="brand-bg p-8 text-center">
            <h1 class="text-2xl font-bold text-white tracking-wide">Admin Portal</h1>
            <p class="text-blue-200 text-sm mt-2 font-medium">Manage your forms and payouts</p>
        </div>

        <div class="flex border-b border-slate-100">
            <button id="tab-login" class="flex-1 py-4 text-sm font-bold uppercase tracking-wide tab-active transition-colors">
                Log In
            </button>
            <button id="tab-signup" class="flex-1 py-4 text-sm font-bold uppercase tracking-wide tab-inactive transition-colors">
                Create Account
            </button>
        </div>

        <div class="p-8 pt-6">
            <form id="auth-form" class="space-y-5">
                
                <div class="space-y-1">
                    <label for="email" class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com"
                        class="block w-full rounded-xl border-slate-200 bg-slate-50 p-4 text-slate-900 focus:bg-white input-field outline-none border">
                </div>

                <div class="space-y-1">
                    <label for="password" class="text-xs font-bold text-slate-500 uppercase tracking-wider ml-1">Password</label>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="block w-full rounded-xl border-slate-200 bg-slate-50 p-4 text-slate-900 focus:bg-white input-field outline-none border">
                </div>

                <div id="message-area" class="hidden text-sm font-medium p-4 rounded-xl text-center"></div>

                <button type="submit" id="submit-button"
                    class="w-full py-4 rounded-xl text-white font-bold text-lg bg-[#0a2540] hover:bg-[#163a5f] active:scale-[0.98] transition-all shadow-lg shadow-blue-900/20 mt-2">
                    Log In
                </button>
            </form>

            <p class="text-center text-xs text-slate-400 mt-6">
                Protected by secure authentication.
            </p>
        </div>
    </div>

    <script type="module">
        import { supabase, auth, showMessage } from './js/utils.js';

        const formEl = document.getElementById('auth-form');
        const submitBtn = document.getElementById('submit-button');
        const messageArea = document.getElementById('message-area');
        
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        
        let isLoginMode = true;

        // --- 1. Check Session ---
        auth.getUser().then(({ data: { user } }) => {
            if (user) window.location.href = '/admin.html';
        });

        // --- 2. Toggle Login / Signup Mode ---
        function toggleMode(login) {
            isLoginMode = login;
            messageArea.classList.add('hidden');
            formEl.reset();

            if (isLoginMode) {
                tabLogin.className = 'flex-1 py-4 text-sm font-bold uppercase tracking-wide tab-active transition-colors';
                tabSignup.className = 'flex-1 py-4 text-sm font-bold uppercase tracking-wide tab-inactive transition-colors';
                submitBtn.textContent = 'Log In';
            } else {
                tabLogin.className = 'flex-1 py-4 text-sm font-bold uppercase tracking-wide tab-inactive transition-colors';
                tabSignup.className = 'flex-1 py-4 text-sm font-bold uppercase tracking-wide tab-active transition-colors';
                submitBtn.textContent = 'Create Account';
            }
        }

        tabLogin.addEventListener('click', () => toggleMode(true));
        tabSignup.addEventListener('click', () => toggleMode(false));

        // --- 3. Handle Submit ---
        formEl.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI Loading State
            submitBtn.disabled = true;
            const originalText = submitBtn.textContent;
            submitBtn.textContent = isLoginMode ? 'Verifying...' : 'Creating Account...';
            messageArea.classList.add('hidden');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                let error;

                if (isLoginMode) {
                    // --- LOGIN LOGIC (Original) ---
                    const { error: signInError } = await auth.signInWithPassword({ email, password });
                    error = signInError;
                    if (!error) {
                        window.location.href = '/admin.html';
                        return;
                    }
                } else {
                    // --- SIGNUP LOGIC (New) ---
                    const { data, error: signUpError } = await supabase.auth.signUp({ 
                        email, 
                        password 
                    });
                    error = signUpError;
                    
                    if (!error) {
                        // Check if email confirmation is required
                        if (data?.user && !data.user.confirmed_at && !data.session) {
                            showMessage('message-area', 'Account created! Please check your email to confirm.', false); // False = green/success
                            submitBtn.textContent = 'Check Email';
                            return; 
                        }
                        // If auto-confirmed or session active
                        window.location.href = '/admin.html';
                        return;
                    }
                }

                if (error) throw new Error(error.message);

            } catch (error) {
                console.error('Auth Error:', error);
                // Helper to color the error message red
                showMessage('message-area', error.message, true); 
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
