<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(circle at top right, #e2e8f0 0%, #f8fafc 100%);
        }
        .brand-bg { background-color: #0a2540; }
        .btn-primary { background-color: #10b981; }
        .btn-primary:hover { background-color: #059669; }
        /* Smooth fade in */
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-6">

    <div id="loading" class="flex flex-col items-center justify-center space-y-4 animate-pulse">
        <div class="h-12 w-12 border-4 border-slate-200 border-t-[#0a2540] rounded-full animate-spin"></div>
        <div class="text-slate-500 font-medium">Loading details...</div>
    </div>

    <div id="closed-message" class="hidden w-full max-w-lg bg-white shadow-2xl rounded-3xl overflow-hidden border border-slate-100 fade-in">
        <div class="p-10 text-center">
            <div class="w-20 h-20 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m0-6V7m0 10a9 9 0 110-18 9 9 0 010 18z" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 mb-2">Registration Closed</h1>
            <p id="closed-text" class="text-slate-500 leading-relaxed"></p>
        </div>
    </div>

    <div id="form-container" class="hidden w-full max-w-xl bg-white shadow-2xl rounded-3xl overflow-hidden border border-slate-100 fade-in my-8">
        
        <div class="brand-bg p-8 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
            <h1 id="form-title" class="text-2xl md:text-3xl font-bold text-white relative z-10 tracking-tight"></h1>
            <p id="form-description" class="text-slate-300 mt-2 text-sm md:text-base relative z-10 leading-relaxed max-w-md mx-auto"></p>
        </div>

        <form id="registration-form" class="p-6 md:p-8 space-y-6">
            
            <div class="space-y-5">
                <div class="group">
                    <label for="name" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1 ml-1">Full Name</label>
                    <input type="text" id="name" required placeholder="e.g. John Doe"
                        class="block w-full rounded-xl border-slate-200 bg-slate-50 p-4 text-slate-900 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all outline-none border">
                </div>

                <div class="group">
                    <label for="email" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1 ml-1">Email Address</label>
                    <input type="email" id="email" required placeholder="john@example.com"
                        class="block w-full rounded-xl border-slate-200 bg-slate-50 p-4 text-slate-900 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all outline-none border">
                </div>
            </div>

            <div id="dynamic-fields-container" class="space-y-5 pt-2">
                </div>

            <div id="message-area" class="text-sm font-medium hidden p-4 rounded-xl bg-slate-100 text-center"></div>

            <div class="pt-4">
                <button type="submit" id="submit-button"
                    class="w-full py-4 px-6 rounded-xl shadow-lg shadow-emerald-500/20 text-lg font-bold text-white btn-primary active:scale-[0.98] transition-all flex items-center justify-center">
                    <span>Complete Registration</span>
                    <span id="price-display" class="ml-2 bg-emerald-800/20 px-2 py-0.5 rounded text-sm text-white">...</span>
                </button>
                <p class="text-center text-xs text-slate-400 mt-4 flex items-center justify-center gap-1">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg>
                    Secure SSL Payment
                </p>
            </div>
        </form>
    </div>

    <script type="module">
        import { supabase, showMessage, SUPABASE_URL } from '/js/utils.js';
        // ... (Keep the rest of your form-viewer logic exactly as is) ...
        const urlParams = new URLSearchParams(window.location.search);
        const SLUG = urlParams.get('slug'); 

        const loadingEl = document.getElementById('loading');
        const closedMsgEl = document.getElementById('closed-message');
        const formContainerEl = document.getElementById('form-container');
        const formEl = document.getElementById('registration-form');
        const dynamicFieldsContainer = document.getElementById('dynamic-fields-container');
        const submitBtn = document.getElementById('submit-button');
        const messageArea = document.getElementById('message-area');
        const priceDisplay = document.getElementById('price-display');

        let FORM_CONFIG = null;

        const formatCurrency = (kobo) => {
            if (typeof kobo !== 'number') return 'N/A';
            const naira = kobo / 100;
            return new Intl.NumberFormat('en-NG', { style: 'currency', currency: 'NGN' }).format(naira);
        };

        function renderDynamicFields(fields) {
            dynamicFieldsContainer.innerHTML = '';
            fields.sort((a, b) => a.field_order - b.field_order).forEach(field => {
                const required = field.is_required ? 'required' : '';
                const div = document.createElement('div');
                div.className = "group"; // Apply grouping style

                const labelHTML = `<label for="${field.field_key}" class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1 ml-1">${field.field_label}</label>`;

                if (field.field_type === 'dropdown') {
                    div.innerHTML = `
                        ${labelHTML}
                        <div class="relative">
                            <select id="${field.field_key}" ${required} class="block w-full rounded-xl border-slate-200 bg-slate-50 p-4 text-slate-900 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all outline-none border appearance-none">
                                <option value="" disabled selected>Select an option</option>
                                ${field.options?.map(opt => `<option value="${opt}">${opt}</option>`).join('') || ''}
                            </select>
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
                                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
                            </div>
                        </div>
                    `;
                } else {
                    div.innerHTML = `
                        ${labelHTML}
                        <input type="${field.field_type}" id="${field.field_key}" ${required} class="block w-full rounded-xl border-slate-200 bg-slate-50 p-4 text-slate-900 focus:bg-white focus:border-emerald-500 focus:ring-4 focus:ring-emerald-500/10 transition-all outline-none border">
                    `;
                }
                dynamicFieldsContainer.appendChild(div);
            });
        }

        formEl.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!FORM_CONFIG) return;

            submitBtn.disabled = true;
            messageArea.classList.add('hidden');
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = `<span class="flex items-center gap-2"><div class="w-4 h-4 border-2 border-white/50 border-t-white rounded-full animate-spin"></div> Processing...</span>`;

            try {
                const customAnswers = {};
                FORM_CONFIG.fields.forEach(field => {
                    const fieldEl = document.getElementById(field.field_key);
                    if (!fieldEl) return;
                    let value = field.field_type === 'dropdown' ? (fieldEl.options[fieldEl.selectedIndex]?.value || '') : fieldEl.value.trim();
                    customAnswers[field.field_key] = value;
                });

                const submissionData = {
                    form_id: FORM_CONFIG.id,
                    name: document.getElementById('name').value.trim(),
                    email: document.getElementById('email').value.trim(),
                    answers: JSON.stringify(customAnswers)
                };

                const edgeFunctionUrl = `${SUPABASE_URL}/functions/v1/create-entry`;
                const response = await fetch(edgeFunctionUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(submissionData)
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || 'Submission failed.');

                if (result.requires_payment === false) {
                    window.location.href = `/thank-you.html?reference=${result.reference}`;
                    return;
                }
                window.location.href = result.authorization_url;

            } catch (error) {
                console.error('Submission Error:', error);
                showMessage('message-area', `Error: ${error.message}`, true);
                
                // Revert button text
                const priceText = FORM_CONFIG.requires_payment && FORM_CONFIG.price > 0 ? formatCurrency(FORM_CONFIG.price) : 'Registration';
                submitBtn.innerHTML = `<span>Submit</span> <span class="ml-2 bg-emerald-800/20 px-2 py-0.5 rounded text-sm text-white">${priceText}</span>`;
                submitBtn.disabled = false;
            }
        });

        async function fetchFormConfig() {
            if (!SLUG) { loadingEl.textContent = 'Error: Missing form slug.'; return; }
            loadingEl.textContent = 'Loading secure form...';

            const { data: form, error: formError } = await supabase.from('forms').select('id, title, description, is_open, price, requires_payment').eq('slug', SLUG).single();
            if (formError || !form) { loadingEl.classList.add('hidden'); closedMsgEl.classList.remove('hidden'); document.getElementById('closed-text').textContent = 'This form is currently unavailable.'; return; }

            const { data: fields } = await supabase.from('form_fields').select('*').eq('form_id', form.id).order('field_order', { ascending: true });
            FORM_CONFIG = { ...form, fields: fields || [] };
            loadingEl.classList.add('hidden');

            document.getElementById('form-title').textContent = form.title;
            document.getElementById('form-description').textContent = form.description;
            document.title = form.title;

            const priceText = form.requires_payment && form.price > 0 ? formatCurrency(form.price) : 'Free';
            priceDisplay.textContent = priceText;
            renderDynamicFields(FORM_CONFIG.fields);

            if (form.is_open === false) { closedMsgEl.classList.remove('hidden'); } else { formContainerEl.classList.remove('hidden'); }
        }
        fetchFormConfig();
    </script>
</body>
</html>
